[pytest]
addopts = -ra -p no:asyncio
markers =
  gpu: requires a CUDA GPU and local model weights
  api: requires configured external API credentials and network access
filterwarnings =
  ignore:ast.Num is deprecated.*:DeprecationWarning:sympy.parsing.sympy_parser
  ignore:ast.NameConstant is deprecated.*:DeprecationWarning:sympy.parsing.sympy_parser
  ignore:.*unexpected keyword argument 'ctx'.*:DeprecationWarning:ast
  ignore:.*unexpected keyword argument 'starargs'.*:DeprecationWarning:sympy.parsing.sympy_parser
  ignore:.*unexpected keyword argument 'kwargs'.*:DeprecationWarning:sympy.parsing.sympy_parser
