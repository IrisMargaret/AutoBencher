extends: quick_flywheel_27.yaml

schema_version: "1.0"

# Low-cost functional verification:
# fixed-set baseline -> 8 generated questions -> one QLoRA epoch ->
# the same immutable fixed-set evaluation.
experiment:
  name: mini_math_flywheel_8
  mode: data_flywheel
  num_iterations: 1
  max_cycles: 1
  questions_per_iteration: 8
  export_interval: 1
  clean_cycle_cache: true
  resume: true

generation:
  max_questions_per_prompt: 1
  max_quota_repair_rounds: 3
  minimum_verified_questions: 1
  gold_solver_backend: sympy

evaluator_pipeline:
  enabled: false

# Functional verification records objective difficulty but does not spend
# repair budget rejecting an otherwise valid question solely for calibration.
difficulty:
  mismatch_action: relabel
  reject_outside_generation_bounds: false
  use_observed_score_for_adaptive_sampling: true

# Keep the functional smoke chain dependency-light. datasketch is preferred
# when installed; otherwise the exporter uses deterministic built-in MinHash
# with exhaustive pair comparison. Production profiles remain fail-closed.
dataset:
  allow_optional_backend_fallback: true
  datasketch_enabled: true
  datasketch_required: false
  datasketch_lsh_enabled: true
  sentence_transformers_enabled: false
  sentence_transformers_required: false

# A functional smoke run must not require a complete 25/75 block. Do not use
# this relaxed mix for a production-quality training run.
training_mix:
  strict_correct_incorrect_ratio: false
  minimum_samples: 1

finetune:
  enabled: true
  gpu: "0"
  epochs: 1
  batch_size: 1
  lora_rank: 4
  max_seq_length: 1024
  learning_rate: 2.0e-4
  save_step_metrics: true
  merge_adapter: true

fixed_test:
  enabled: true
  evaluate_baseline: true
  evaluate_after_each_training_cycle: true
  fail_on_training_leakage: true

tracking:
  wandb:
    enabled: false
    mode: disabled
    log_model: false
