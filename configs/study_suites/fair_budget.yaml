schema_version: "1.0"

study_suite:
  name: fair_budget_v1
  environment: configs/environments/volcengine.yaml
  output_root: /vepfs-mlp2/queue010/20262202597/math_flywheel/runs
  allow_missing_artifacts: false
  allow_dirty_worktree: false
  methods:
    - base
    - random
    - uniform
    - error_only
    - full
    - full_no_hard_pool
    - full_no_error_targeting
    - full_no_observed_difficulty_sampling
    - full_no_difficulty_module
  comparison_pairs:
    - {left: random, right: full}
    - {left: uniform, right: full}
    - {left: error_only, right: full}
    - {left: full_no_hard_pool, right: full}
    - {left: full_no_error_targeting, right: full}
    - {left: full_no_observed_difficulty_sampling, right: full}
    - {left: full_no_difficulty_module, right: full}
  seeds:
    - 42
    - 123
    - 2026
  models:
    - name: qwen2.5-7b-instruct
      path: /vepfs-mlp2/queue010/20262202597/Qwen2.5-7B-Instruct
  # This is a safety ceiling. data_matched can stop after reaching its sample
  # target; generation_token_matched stops at its generation-token cap.
  budgets:
    - 13500
  protocols:
    - name: data_matched
      target_training_samples: 1000
    - name: generation_token_matched
      max_generation_tokens: 1000000
  common_overrides:
    - experiment.num_iterations=5
    - experiment.max_cycles=3
    - retention_test.enabled=true
    - generation_guidance.enabled=true
